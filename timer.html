<!DOCTYPE html>
<html>
<head>
    <title>Facebook Video Embed</title>
</head>
<body>

    <div 
        class="fb-video" 
        data-href="https://www.facebook.com/reel/912926467822097/?referral_source=native_watch_in_feed_unit" 
        data-width="500" 
        data-show-text="false">
    </div>

    <div id="fb-root"></div>
    <script async defer src="https://connect.facebook.net/en_US/sdk.js"></script>

    <script>
      window.fbAsyncInit = function() {
        FB.init({
          appId      : '{your-app-id}', // You can leave this blank for simple embeds
          xfbml      : true,
          version    : 'v18.0'
        });

        // Optional: Subscribe to events
        FB.Event.subscribe('xfbml.ready', function(msg) {
          if (msg.type === 'video') {
            console.log('Video player is ready: ' + msg.id);
          }
        });
      };
    </script>

</body>
</html>
