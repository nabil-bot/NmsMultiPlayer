
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMS Multiplayer</title>
   <link rel="stylesheet" href="css/all.min.css">
   <link rel="stylesheet" href="./Styles/variables.css">
  <link rel="stylesheet" href="./Styles/styles.css">
  <link rel="stylesheet" href="./Styles/initVisible.css">
  <link rel="stylesheet" href="./Styles/audioPlayer.css">
  <link rel="stylesheet" href="./Styles/timerPicker.css">
  <link rel="stylesheet" href="./Styles/facebook.css">
</head>
<body>
  <main id="main-contents-container">
  <header>
    <h1>Nms Multiplayer!</h1>
  </header>
  <div id="videos-container">
    <!-- Videos will be dynamically added here -->
  </div>
  <div id="globalControls" class="global-controls-container">
      <button id="play-all-button" class="playAll"><i class="fa-solid fa-play"></i><span>Play</span></button>
      <button id="pause-all-button" class="pauseAll"><i class="fa-solid fa-pause"></i><span>Pause</span></button>
      <button id="clear-all-button" class="pauseAll"><i class="fa-solid fa-trash"></i><span>Clear</span></button>
      <button id="replay-button" class="pauseAll"><i class="fa-solid fa-reply"></i><span>Replay</span></button>
    </div>
  <div id="controls">
    <div class="input-area">
      <button id="paste-btn" class="pasteBtn"><i class="fa-regular fa-paste"></i></button>
      <input type="text" id="video-url" class="inputField" placeholder="Enter Video URL">
      <button id="clear-button" class="clearBtn"><i class="fa-regular fa-circle-xmark"></i></button>
    </div>
    <div class="submit-area">
      <button id="add-video-btn" class="addBtn"><i class="fa-solid fa-plus"></i> Add Video</button>
      <button id="browse-btn" class="browseBtn"><i class="fa-brands fa-chrome"></i> Browse</button>
    </div>
  </div>


  <div id="goblaControls">
  <div class="group-container">
    
	  <input type="file" id="file-input" class="hidden-input" accept="audio/*,video/*" multiple>
	  <label for="file-input" class="file-input-label"><i class="fa-regular fa-file"></i> Add a local file</label>
	  
	  </div>
  
  </main>
    <div id="pause-timer-modal" class="timer-modal">
  <div class="timer-modal-content">
    <h2 class="PauseTitle">Set Pause Timer</h2>
    <div class="roller-wrapper">
        <div class="selection-overlay"></div>
        
        <div class="label-container">
            <span class="stationary-label">min</span>
            <span class="stationary-label">sec</span>
        </div>
        
        <div class="roller" id="min-roller">
            <ul class="roller-list" id="min-list"></ul>
        </div>

        <div class="roller" id="sec-roller">
            <ul class="roller-list" id="sec-list"></ul>
        </div>
    </div>

    <div class="actions">
        <button class="timer-cancel" id="timer-cancel">Cancel</button>
        <button class="btn-set" id="timer-set">Set</button>
    </div>

    <input type="number" id="timer-min" value="0">
    <input type="number" id="timer-sec" value="0">


</div>

</div>
  </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- <script type="module" src="./Scripts/script.js"></script> -->
    <script src="./Scripts/script.js"></script>

    <script src="./Scripts/timer.js"></script>
</div>
</body>
</html>
