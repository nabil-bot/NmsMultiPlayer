
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMS Multiplayer</title>
  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"> -->
   <link rel="stylesheet" href="css/all.min.css">
   <link rel="stylesheet" href="./Styles/variables.css">
  <link rel="stylesheet" href="./Styles/styles.css">
  <link rel="stylesheet" href="./Styles/initVisible.css">
</head>
<body>
  <header>
    <h1>Nms Multiplayer</h1>
  </header>
  <div id="videos-container">
    <!-- Videos will be dynamically added here -->
  </div>
  <div id="globalControls" class="global-controls-container">
      <button id="play-all-button" class="playAll"><i class="fa-solid fa-play"></i> Play</button>
      <button id="pause-all-button" class="pauseAll"><i class="fa-solid fa-pause"></i> Pause</button>
      <button id="clear-all-button" class="pauseAll"><i class="fa-solid fa-trash"></i> Clear</button>
    </div>
  <div id="controls">
    <div class="input-area">
      <button id="paste-btn" class="pasteBtn"><i class="fa-regular fa-paste"></i></button>
      <input type="text" id="video-url" class="inputField" placeholder="Enter Video URL">
      <button id="clear-button" class="clearBtn"><i class="fa-regular fa-circle-xmark"></i></button>
    </div>
    <div class="submit-area">
      <button id="add-video-btn" class="addBtn"><i class="fa-solid fa-plus"></i> Add Video</button>
      <button id="browse-btn" class="browseBtn"><i class="fa-brands fa-chrome"></i> Browse</button>
    </div>
  </div>


  <div id="goblaControls">
  <div class="group-container">
    
	  <input type="file" id="file-input" class="hidden-input" accept="audio/*,video/*" multiple>
	  <label for="file-input" class="file-input-label"><i class="fa-regular fa-file"></i> Add a local file</label>
	  
<!--	  <button onClick="selectFileUsingExpo()">Expo picker</button>-->
	  
	  </div>
  
    <div id="pause-timer-modal" class="timer-modal">
  <div class="timer-modal-content">
    <h3>Set Pause Timer</h3>
    <label>Minutes:</label>
    <input type="number" id="timer-min" min="0" value="0">
    <label>Seconds:</label>
    <input type="number" id="timer-sec" min="0" value="0">
    <div class="timer-buttons">
      <button id="timer-cancel">Cancel</button>
      <button id="timer-set">Set Timer</button>
    </div>
  </div>
</div>
  </div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="./Scripts/script.js"></script>
</div>
</body>
</html>
